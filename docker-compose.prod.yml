# MAGE - Production Docker Compose Configuration
# 
# Pre-configured for Option 1: Separate Subdomains
# - Frontend: mage.aronschueler.de (port 3000)
# - Backend:  api.mage.aronschueler.de (port 17171)
#
# Services:
#   - mage-server: Go backend server (gRPC + WebSocket + HTTP)
#   - mage-client: Svelte web client
#   - postgres: PostgreSQL database
#
# Before deploying:
#   1. Replace 'aronschueler.de' with your actual domain in lines 90 and 101
#   2. Ensure DNS records point to your server (192.168.178.24)
#   3. Run: ./deploy.sh
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d --build      # Rebuild and start
#   docker compose logs -f            # View logs
#   docker compose down               # Stop all services
#   docker compose down -v            # Stop and remove volumes

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: mage-postgres
    environment:
      POSTGRES_DB: mage
      POSTGRES_USER: mage
      POSTGRES_PASSWORD: mage
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init scripts are ONLY executed on first boot (empty data dir),
      # i.e. after: docker compose down -v
      - ./mage-server-go/docker-initdb/00_migrate_and_import.sh:/docker-entrypoint-initdb.d/00_migrate_and_import.sh:ro
      - ./mage-server-go/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./mage-server-go/data:/docker-entrypoint-initdb.d/data:ro
    # Port not exposed to host for security - containers communicate via Docker network
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mage -d mage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mage-network
    restart: unless-stopped

  # MAGE Go backend server
  mage-server:
    build:
      context: ./mage-server-go
      dockerfile: Dockerfile
    container_name: mage-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database configuration
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: mage
      DATABASE_USER: mage
      DATABASE_PASSWORD: mage
      DATABASE_SSLMODE: disable
      # Server configuration
      SERVER_NAME: mage-server
      GRPC_ADDRESS: "0.0.0.0:17171"
      WEBSOCKET_ADDRESS: "0.0.0.0:17179"
      HEALTH_ADDRESS: "0.0.0.0:8080"
    ports:
      - "17171:17171"  # gRPC / HTTP-JSON API
      - "17179:17179"  # WebSocket
      - "8080:8080"    # Health check
    volumes:
      # Mount the Docker-specific config file
      - ./mage-server-go/config/config.docker.yaml:/app/config/config.yaml:ro
    networks:
      - mage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # MAGE Svelte web client
  mage-client:
    build:
      context: ./mage-client-web
      dockerfile: Dockerfile
      args:
        VITE_GRPC_SERVER_URL: https://api.mage.aronschueler.de
    container_name: mage-client
    depends_on:
      mage-server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Frontend domain
      ORIGIN: https://mage.aronschueler.de
    ports:
      - "38216:3000"
    networks:
      - mage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
    driver: local

networks:
  mage-network:
    driver: bridge
