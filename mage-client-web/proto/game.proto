syntax = "proto3";

package mage.game;

// Example game service for the MAGE multiplayer system
service GameService {
  // Get current game state
  rpc GetGameState(GameStateRequest) returns (GameStateResponse);

  // Stream game updates in real-time
  rpc StreamGameUpdates(GameStateRequest) returns (stream GameUpdate);

  // Perform a game action (play card, pass priority, etc.)
  rpc PerformAction(GameActionRequest) returns (GameActionResponse);
}

// Request to get game state
message GameStateRequest {
  string game_id = 1;
  string player_id = 2;
}

// Game state response
message GameStateResponse {
  string game_id = 1;
  GameState state = 2;
}

// Game state structure
message GameState {
  int32 turn_number = 1;
  string current_phase = 2;
  string active_player_id = 3;
  string priority_player_id = 4;
  repeated Player players = 5;
  repeated Card battlefield = 6;
  repeated StackItem stack = 7;
}

// Player information
message Player {
  string player_id = 1;
  string username = 2;
  int32 life = 3;
  int32 hand_size = 4;
  int32 library_size = 5;
  int32 graveyard_size = 6;
  repeated Card hand = 7;
  repeated Card graveyard = 8;
}

// Card representation
message Card {
  string card_id = 1;
  string name = 2;
  string mana_cost = 3;
  string type_line = 4;
  bool tapped = 5;
  int32 power = 6;
  int32 toughness = 7;
  string controller_id = 8;
  string owner_id = 9;
}

// Stack item (spell or ability)
message StackItem {
  string item_id = 1;
  string source_card_id = 2;
  string controller_id = 3;
  string description = 4;
}

// Real-time game update
message GameUpdate {
  string game_id = 1;
  UpdateType type = 2;
  GameState state = 3;
  string message = 4;
}

enum UpdateType {
  STATE_CHANGE = 0;
  CARD_PLAYED = 1;
  PHASE_CHANGE = 2;
  DAMAGE_DEALT = 3;
  PLAYER_ACTION = 4;
}

// Game action request
message GameActionRequest {
  string game_id = 1;
  string player_id = 2;
  ActionType action_type = 3;
  string card_id = 4;
  repeated string target_ids = 5;
  map<string, string> parameters = 6;
}

enum ActionType {
  PLAY_CARD = 0;
  ACTIVATE_ABILITY = 1;
  PASS_PRIORITY = 2;
  DECLARE_ATTACKERS = 3;
  DECLARE_BLOCKERS = 4;
  CONCEDE = 5;
}

// Game action response
message GameActionResponse {
  bool success = 1;
  string message = 2;
  GameState new_state = 3;
}
