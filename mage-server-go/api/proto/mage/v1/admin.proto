syntax = "proto3";

package mage.v1;

option go_package = "github.com/magefree/mage-server-go/pkg/proto/mage/v1";

import "mage/v1/models.proto";

// Admin Messages

message AdminGetUsersRequest {
  string session_id = 1;
}

message AdminGetUsersResponse {
  repeated UserView users = 1;
}

message AdminDisconnectUserRequest {
  string session_id = 1;
  string user_name = 2;
}

message AdminDisconnectUserResponse {
  bool success = 1;
  string error = 2;
}

message AdminMuteUserRequest {
  string session_id = 1;
  string user_name = 2;
  int64 duration_minutes = 3;
}

message AdminMuteUserResponse {
  bool success = 1;
  string error = 2;
}

message AdminLockUserRequest {
  string session_id = 1;
  string user_name = 2;
  int64 duration_minutes = 3;
  string reason = 4;
}

message AdminLockUserResponse {
  bool success = 1;
  string error = 2;
}

message AdminActivateUserRequest {
  string session_id = 1;
  string user_name = 2;
}

message AdminActivateUserResponse {
  bool success = 1;
  string error = 2;
}

message AdminToggleActivateUserRequest {
  string session_id = 1;
  string user_name = 2;
}

message AdminToggleActivateUserResponse {
  bool success = 1;
  string error = 2;
  bool new_status = 3;
}

message AdminEndUserSessionRequest {
  string session_id = 1;
  string target_session_id = 2;
}

message AdminEndUserSessionResponse {
  bool success = 1;
  string error = 2;
}

message AdminTableRemoveRequest {
  string session_id = 1;
  string table_id = 2;
}

message AdminTableRemoveResponse {
  bool success = 1;
  string error = 2;
}

message AdminSendBroadcastMessageRequest {
  string session_id = 1;
  string message = 2;
}

message AdminSendBroadcastMessageResponse {
  bool success = 1;
  string error = 2;
  int32 recipient_count = 3;
}

// ==================== Debug/Diagnostic Messages ====================

// Debug active game info with full details
message DebugActiveGameInfo {
  string game_id = 1;
  string table_id = 2;
  string game_type = 3;
  repeated string players = 4;
  int32 turn_number = 5;
  string state = 6;
  string created_at = 7;
  string updated_at = 8;
  bool in_memory = 9;  // Whether game exists in server memory
  bool in_database = 10;  // Whether game exists in database
}

// Get all active games from database (admin debug)
message AdminGetAllActiveGamesRequest {
  string session_id = 1;
}

message AdminGetAllActiveGamesResponse {
  repeated DebugActiveGameInfo games = 1;
  int32 total_in_memory = 2;
  int32 total_in_database = 3;
}

// Get server debug state including memory vs database comparison
message AdminGetServerDebugStateRequest {
  string session_id = 1;
}

message AdminGetServerDebugStateResponse {
  // Server memory state
  int32 memory_active_games = 1;
  int32 memory_active_tables = 2;
  int32 memory_active_sessions = 3;
  
  // Database state
  int32 db_active_games = 4;
  int32 db_match_history = 5;
  
  // Discrepancies
  repeated string games_in_memory_only = 6;
  repeated string games_in_db_only = 7;
  
  // Server info
  string server_uptime = 8;
  string last_game_save = 9;
}
