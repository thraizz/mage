syntax = "proto3";

package mage.v1;

option go_package = "github.com/magefree/mage-server-go/pkg/proto/mage/v1";

import "mage/v1/models.proto";

// Table Management Messages

message RoomCreateTableRequest {
  string session_id = 1;
  string room_id = 2;
  MatchOptions match_options = 3;
}

message RoomCreateTableResponse {
  bool success = 1;
  string error = 2;
  string table_id = 3;
}

message RoomCreateTournamentRequest {
  string session_id = 1;
  string room_id = 2;
  TournamentOptions tournament_options = 3;
}

message TournamentOptions {
  string name = 1;
  string tournament_type = 2;
  int32 num_wins = 3;
  int32 constructed_deck_size = 4;
  int32 draft_cube_id = 5;
  int32 limited_packs = 6;
  int32 num_rounds = 7;
  int32 free_mulligans = 8;
  string draft_timing = 9;
  bool rated = 10;
  int32 quit_ratio = 11;
  int32 minimum_rating = 12;
  repeated string sets = 13;
}

message RoomCreateTournamentResponse {
  bool success = 1;
  string error = 2;
  string tournament_id = 3;
}

message RoomJoinTableRequest {
  string session_id = 1;
  string room_id = 2;
  string table_id = 3;
  string player_name = 4;
  string player_type = 5;
  int32 skill_level = 6;
  string deck_list = 7;
  string password = 8;
}

message RoomJoinTableResponse {
  bool success = 1;
  string error = 2;
}

message RoomJoinTournamentRequest {
  string session_id = 1;
  string room_id = 2;
  string tournament_id = 3;
  string player_name = 4;
  string player_type = 5;
  int32 skill_level = 6;
  string deck_list = 7;
}

message RoomJoinTournamentResponse {
  bool success = 1;
  string error = 2;
}

message RoomLeaveTableOrTournamentRequest {
  string session_id = 1;
  string room_id = 2;
  string table_id = 3;
}

message RoomLeaveTableOrTournamentResponse {
  bool success = 1;
  string error = 2;
}

message RoomWatchTableRequest {
  string session_id = 1;
  string room_id = 2;
  string table_id = 3;
}

message RoomWatchTableResponse {
  bool success = 1;
  string error = 2;
}

message RoomWatchTournamentRequest {
  string session_id = 1;
  string room_id = 2;
  string tournament_id = 3;
}

message RoomWatchTournamentResponse {
  bool success = 1;
  string error = 2;
}

message TableSwapSeatsRequest {
  string session_id = 1;
  string room_id = 2;
  string table_id = 3;
  int32 seat_num1 = 4;
  int32 seat_num2 = 5;
}

message TableSwapSeatsResponse {
  bool success = 1;
  string error = 2;
}

message TableRemoveRequest {
  string session_id = 1;
  string room_id = 2;
  string table_id = 3;
}

message TableRemoveResponse {
  bool success = 1;
  string error = 2;
}

message TableIsOwnerRequest {
  string session_id = 1;
  string room_id = 2;
  string table_id = 3;
}

message TableIsOwnerResponse {
  bool is_owner = 1;
}

message DeckSubmitRequest {
  string session_id = 1;
  string table_id = 2;
  DeckCardLists deck = 3;
}

// DeckCard contains a card name and its full metadata
message DeckCard {
  string name = 1;
  string mana_cost = 2;      // e.g., "{2}{U}{U}"
  string card_type = 3;      // e.g., "Creature - Human Wizard"
  repeated string types = 4; // e.g., ["CREATURE", "INSTANT"]
  repeated string colors = 5; // e.g., ["U", "W"] (W=White, U=Blue, B=Black, R=Red, G=Green)
  string power = 6;          // For creatures, e.g., "2"
  string toughness = 7;      // For creatures, e.g., "3"
  int32 quantity = 8;        // Number of copies in the deck
}

message DeckCardLists {
  repeated DeckCard main_deck = 1;
  repeated DeckCard sideboard = 2;
  repeated DeckCard commanders = 3; // For Commander format (usually 1-2 cards)
}

message DeckSubmitResponse {
  bool success = 1;
  string error = 2;
}

message DeckSaveRequest {
  string session_id = 1;
  string deck_name = 2;
  DeckCardLists deck = 3;
  string format = 4; // e.g., "Standard", "Modern", "Commander"
  string description = 5; // Optional deck description
}

message DeckSaveResponse {
  bool success = 1;
  string error = 2;
  int64 deck_id = 3;
}

message DeckListRequest {
  string session_id = 1;
  string format = 2; // Optional: filter by format (e.g., "Standard", "Modern", "Commander")
}

message DeckInfo {
  int64 id = 1;
  string name = 2;
  string format = 3;
  string description = 4;
  int32 main_deck_count = 5;
  int32 sideboard_count = 6;
  int32 commander_count = 9;
  int64 created_at = 7; // Unix timestamp
  int64 updated_at = 8; // Unix timestamp
}

message DeckListResponse {
  bool success = 1;
  string error = 2;
  repeated DeckInfo decks = 3;
}

message DeckDeleteRequest {
  string session_id = 1;
  int64 deck_id = 2;
}

message DeckDeleteResponse {
  bool success = 1;
  string error = 2;
}

message DeckGetRequest {
  string session_id = 1;
  int64 deck_id = 2;
}

message DeckGetResponse {
  bool success = 1;
  string error = 2;
  DeckInfo info = 3;
  DeckCardLists deck = 4;
}
