syntax = "proto3";

package mage.v1;

option go_package = "github.com/magefree/mage-server-go/pkg/proto/mage/v1";

import "mage/v1/models.proto";

// Game Execution Messages

message GameJoinRequest {
  string session_id = 1;
  string game_id = 2;
}

message GameJoinResponse {
  bool success = 1;
  string error = 2;
}

message GameWatchStartRequest {
  string session_id = 1;
  string game_id = 2;
}

message GameWatchStartResponse {
  bool success = 1;
  string error = 2;
}

message GameWatchStopRequest {
  string session_id = 1;
  string game_id = 2;
}

message GameWatchStopResponse {
  bool success = 1;
  string error = 2;
}

message GameGetViewRequest {
  string session_id = 1;
  string game_id = 2;
  string player_id = 3;
}

message GameGetViewResponse {
  GameView game = 1;
}

message SendPlayerUUIDRequest {
  string session_id = 1;
  string game_id = 2;
  string uuid = 3;
}

message SendPlayerUUIDResponse {
  bool success = 1;
  string error = 2;
}

message SendPlayerStringRequest {
  string session_id = 1;
  string game_id = 2;
  string data = 3;
}

message SendPlayerStringResponse {
  bool success = 1;
  string error = 2;
}

message SendPlayerBooleanRequest {
  string session_id = 1;
  string game_id = 2;
  bool data = 3;
}

message SendPlayerBooleanResponse {
  bool success = 1;
  string error = 2;
}

message SendPlayerIntegerRequest {
  string session_id = 1;
  string game_id = 2;
  int32 data = 3;
}

message SendPlayerIntegerResponse {
  bool success = 1;
  string error = 2;
}

message SendPlayerManaTypeRequest {
  string session_id = 1;
  string game_id = 2;
  string mana_type = 3;
  string mana_type_str = 4;
}

message SendPlayerManaTypeResponse {
  bool success = 1;
  string error = 2;
}

message SendPlayerActionRequest {
  string session_id = 1;
  string game_id = 2;
  PlayerAction action = 3;
}

enum PlayerAction {
  PLAYER_ACTION_UNSPECIFIED = 0;
  PASS = 1;
  PASS_TURN = 2;
  UNDO = 3;
  CONCEDE = 4;
  PASS_UNTIL_END_OF_TURN = 5;
  PASS_UNTIL_NEXT_TURN = 6;
  PASS_UNTIL_STACK_RESOLVED = 7;
  PASS_UNTIL_MY_NEXT_TURN = 8;
}

message SendPlayerActionResponse {
  bool success = 1;
  string error = 2;
}

// Special action types (lands, foretell, etc.)
enum SpecialActionType {
  SPECIAL_ACTION_UNSPECIFIED = 0;
  PLAY_LAND = 1;
  FORETELL = 2;
  SUSPEND = 3;
  COMPANION = 4;
  ADVANCE_PHASE = 5;  // Manually advance to next phase/step
}

message SendSpecialActionRequest {
  string session_id = 1;
  string game_id = 2;
  SpecialActionType action_type = 3;
  string source_id = 4;  // Card UUID
}

message SendSpecialActionResponse {
  bool success = 1;
  string error = 2;
}

message MatchStartRequest {
  string session_id = 1;
  string table_id = 2;
}

message MatchStartResponse {
  bool success = 1;
  string error = 2;
  string game_id = 3;
}

message MatchQuitRequest {
  string session_id = 1;
  string game_id = 2;
}

message MatchQuitResponse {
  bool success = 1;
  string error = 2;
}

// Replay Messages

message ReplayInitRequest {
  string session_id = 1;
  string game_id = 2;
}

message ReplayInitResponse {
  bool success = 1;
  string error = 2;
}

message ReplayStartRequest {
  string session_id = 1;
  string game_id = 2;
}

message ReplayStartResponse {
  bool success = 1;
  string error = 2;
}

message ReplayStopRequest {
  string session_id = 1;
  string game_id = 2;
}

message ReplayStopResponse {
  bool success = 1;
  string error = 2;
}

message ReplayNextRequest {
  string session_id = 1;
  string game_id = 2;
}

message ReplayNextResponse {
  bool success = 1;
  string error = 2;
}

message ReplayPreviousRequest {
  string session_id = 1;
  string game_id = 2;
}

message ReplayPreviousResponse {
  bool success = 1;
  string error = 2;
}

message ReplaySkipForwardRequest {
  string session_id = 1;
  string game_id = 2;
  int32 steps = 3;
}

message ReplaySkipForwardResponse {
  bool success = 1;
  string error = 2;
}

// Active Game Recovery Messages

// GetMyActiveGames retrieves all active games the current user is participating in
// Used for reconnection after disconnection or server restart
message GetMyActiveGamesRequest {
  string session_id = 1;
}

// ActiveGameInfo represents summary information about an active game
message ActiveGameInfo {
  string game_id = 1;
  string table_id = 2;
  string game_type = 3;
  repeated string players = 4;
  int32 turn_number = 5;
  string state = 6;  // STARTING, MULLIGAN, IN_PROGRESS, PAUSED
  string created_at = 7;  // ISO8601 timestamp
  string updated_at = 8;  // ISO8601 timestamp
}

message GetMyActiveGamesResponse {
  repeated ActiveGameInfo games = 1;
}
