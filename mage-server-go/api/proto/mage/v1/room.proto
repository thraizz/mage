syntax = "proto3";

package mage.v1;

option go_package = "github.com/magefree/mage-server-go/pkg/proto/mage/v1";

import "google/protobuf/timestamp.proto";
import "mage/v1/models.proto";

// Room and Lobby Messages

message ServerGetMainRoomIdRequest {
  string session_id = 1;
}

message ServerGetMainRoomIdResponse {
  string room_id = 1;
}

message RoomGetUsersRequest {
  string session_id = 1;
  string room_id = 2;
}

message RoomGetUsersResponse {
  repeated UserView users = 1;
}

message RoomGetFinishedMatchesRequest {
  string session_id = 1;
  string room_id = 2;
}

message RoomGetFinishedMatchesResponse {
  repeated MatchView finished_matches = 1;
}

message MatchView {
  string game_type = 1;
  string deck_type = 2;
  repeated string players = 3;
  string winner = 4;
  int32 duration_minutes = 5;
  google.protobuf.Timestamp end_time = 6;
  bool is_tournament = 7;
  string table_name = 8;
}

message RoomGetAllTablesRequest {
  string session_id = 1;
  string room_id = 2;
}

message RoomGetAllTablesResponse {
  repeated TableView tables = 1;
}

message RoomGetTableByIdRequest {
  string session_id = 1;
  string room_id = 2;
  string table_id = 3;
}

message RoomGetTableByIdResponse {
  TableView table = 1;
}

// Match History Messages

message GetMatchHistoryRequest {
  string session_id = 1;
  int32 limit = 2;  // Default 50, max 100
  int32 offset = 3; // For pagination
}

message MatchPlayerInfo {
  int64 user_id = 1;
  string username = 2;
  string deck = 3;   // Deck name or summary
  string result = 4; // "win", "loss", "draw", "concede"
}

message MatchHistoryEntry {
  int64 id = 1;
  string game_id = 2;
  string table_id = 3;
  string tournament_id = 4;
  repeated MatchPlayerInfo players = 5;
  string game_type = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  int32 duration_seconds = 9;
  int64 winner_id = 10;
  string winner_name = 11;
  google.protobuf.Timestamp created_at = 12;
}

message GetMatchHistoryResponse {
  bool success = 1;
  string error = 2;
  repeated MatchHistoryEntry matches = 3;
  int32 total_count = 4; // Total matches for this user (for pagination)
}

message GetMatchByIdRequest {
  string session_id = 1;
  int64 match_id = 2;
}

message GetMatchByIdResponse {
  bool success = 1;
  string error = 2;
  MatchHistoryEntry match = 3;
  string replay_data = 4; // Optional: game log for replay
}
